    <script>
        let cart = JSON.parse(localStorage.getItem('suzhou_cart')) || [];

        function updateCartBadge() {
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-badge');
            if(badge) {
                if(totalQty > 0) {
                    badge.innerText = totalQty;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
            const sidebarBadge = document.getElementById('cart-badge-sidebar');
            if(sidebarBadge) {
                if(totalQty > 0) {
                    sidebarBadge.innerText = totalQty;
                    sidebarBadge.classList.remove('hidden');
                } else {
                    sidebarBadge.classList.add('hidden');
                }
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast-message');
            const iconSpan = toast.querySelector('i');
            if(isError) iconSpan.className = "fas fa-exclamation-circle text-amber-300";
            else iconSpan.className = "fas fa-check-circle text-[#B89C68]";
            toast.querySelector('span').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2200);
        }

        function addToCartWithPriority(product) {
            const existingIndex = cart.findIndex(item => item.id === product.id);
            if(existingIndex !== -1) {
                cart[existingIndex].quantity += 1;
                const movedItem = cart.splice(existingIndex, 1)[0];
                cart.unshift(movedItem);
                showToast(`${product.name} 数量+1`);
            } else {
                cart.unshift({ ...product, quantity: 1 });
                showToast(`${product.name} 已加入购物车`);
            }
            localStorage.setItem('suzhou_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function getFilteredProducts() {
            let filtered = allProducts.filter(p => p.price >= currentMinPrice && p.price <= currentMaxPrice);
            if(currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            return filtered;

                    <div class="p-3">
                        <h3 class="font-semibold text-sm text-[#2F4B43] truncate">${escapeHtml(prod.name)}</h3>
                        <p class="text-xs text-gray-500 mt-0.5">${prod.author || ''}</p>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span class="text-[#B89C68] font-bold text-base">¥${formatPrice(prod.price)}</span>
                        </div>
                        <button onclick="handleAddToCart(${prod.id}, '${escapeHtml(prod.name)}', ${prod.price}, '${prod.image}')" class="mt-2 w-full bg-[#7EA08F] hover:bg-[#5c836e] text-white py-1.5 rounded-full transition btn-scale flex items-center justify-center gap-1 text-xs"><i class="fas fa-shopping-cart text-xs"></i> 加入购物车</button>
                    </div>
                </div>
            `).join('');
        }

        function initPriceSliders() {
            const minSlider = document.getElementById('minPriceSlider');
            const maxSlider = document.getElementById('maxPriceSlider');
            const minVal = document.getElementById('minPriceVal');
            const maxVal = document.getElementById('maxPriceVal');
            
            function formatSliderPrice(price) {
                return price.toLocaleString();
            }
            
            function updatePrices() {
                let min = parseInt(minSlider.value);
                let max = parseInt(maxSlider.value);
                if (min > max) {
                    minSlider.value = max;
                    min = max;
                }
                if (max < min) {
                    maxSlider.value = min;
                    max = min;
                }
                minVal.innerText = formatSliderPrice(min);
                maxVal.innerText = formatSliderPrice(max);
                currentMinPrice = min;
                currentMaxPrice = max;
                renderProducts();
            }
            
            minSlider.addEventListener('input', updatePrices);
            maxSlider.addEventListener('input', updatePrices);
            updatePrices();
        }

        function renderSidebarCategories() {
            const container = document.getElementById('categories-container');
            if(!container) return;
            container.innerHTML = categories.map(cat => `
                <div class="category-item flex items-center gap-3 px-4 py-2.5 text-sm ${currentCategory === cat.id ? 'active' : ''}" data-cat="${cat.id}">
                    <i class="${cat.icon} w-5"></i>
                    <span>${cat.name}</span>
                </div>
            `).join('');
            document.querySelectorAll('.category-item').forEach(el => {
                el.addEventListener('click', () => {
                    const catId = el.getAttribute('data-cat');
                    if(catId) {
                        currentCategory = catId;
                        renderSidebarCategories();
                        renderProducts();
                        document.querySelectorAll('.filter-chip').forEach(chip => {
                            chip.classList.remove('active-filter', 'bg-[#B89C68]', 'text-white');
                            chip.classList.add('bg-gray-200', 'text-gray-700');
                            if(chip.getAttribute('data-filter') === catId) {
                                chip.classList.add('active-filter', 'bg-[#B89C68]', 'text-white');
                            }
                        });
                        if(catId === 'all') {
                            document.querySelector('.filter-chip[data-filter="all"]')?.classList.add('active-filter', 'bg-[#B89C68]', 'text-white');
                        }
                    }
                });
            });
        }

        function bindFilterChips() {
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const filterVal = chip.getAttribute('data-filter');
                    if(filterVal) {
                        currentCategory = filterVal;
                        renderSidebarCategories();
                        renderProducts();
                        document.querySelectorAll('.filter-chip').forEach(c => {
                            c.classList.remove('active-filter', 'bg-[#B89C68]', 'text-white');
                            c.classList.add('bg-gray-200', 'text-gray-700');
                        });
                        chip.classList.add('active-filter', 'bg-[#B89C68]', 'text-white');
                    }
                });
            });
        }

        window.handleAddToCart = (id, name, price, image) => {
            addToCartWithPriority({ id, name, price, image });
        };

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        function initUI() {
            const header = document.getElementById('main-header');
            window.addEventListener('scroll', () => {
                if(window.scrollY > 20) header.classList.add('navbar-scrolled');
                else header.classList.remove('navbar-scrolled');
            });
            const menuBtn = document.getElementById('mobile-menu-btn');
            const mobileNav = document.getElementById('mobile-nav');
            if(menuBtn && mobileNav) {
                menuBtn.addEventListener('click', () => {
                    mobileNav.classList.toggle('open');
                });
            }
        }

        function init() {
            renderSidebarCategories();
            renderProducts();
            bindFilterChips();
            initPriceSliders();
            initUI();
            updateCartBadge();
            document.querySelector('.filter-chip[data-filter="all"]')?.classList.add('active-filter', 'bg-[#B89C68]', 'text-white');
        }

        init();
    </script>

<div id="sxShopAi">
  <button class="sx-shop-toggle" type="button">AI</button>
  <div class="sx-shop-panel">
    <div class="sx-shop-header">
      <div class="sx-shop-title">
        <strong>苏绣AI导购助手</strong>
        <span>作品推荐 · 购物帮助 · 活动联动</span>
      </div>
      <button class="sx-shop-close" type="button">×</button>
    </div>
    <div class="sx-shop-messages"></div>
    <div class="sx-shop-quick">
      <button class="sx-shop-chip" data-q="推荐热门苏绣作品">热门作品</button>
      <button class="sx-shop-chip" data-q="推荐适合送礼的文创">送礼文创</button>
      <button class="sx-shop-chip" data-q="根据购物车商品搭配推荐">搭配推荐</button>
      <button class="sx-shop-chip" data-q="推荐近期苏绣展览活动">近期活动</button>
      <button class="sx-shop-chip" data-q="怎么加购和结账">加购结账</button>
    </div>
    <div class="sx-shop-inputbar">
      <input class="sx-shop-input" placeholder="输入问题，比如：适合送长辈的苏绣礼品">
      <button class="sx-shop-send">发送</button>
    </div>
  </div>
</div>

<script>
(() => {
  const root = document.getElementById('sxShopAi');
  if (!root) return;
  const toggle = root.querySelector('.sx-shop-toggle');
  const closeBtn = root.querySelector('.sx-shop-close');
  const list = root.querySelector('.sx-shop-messages');
  const input = root.querySelector('.sx-shop-input');
  const sendBtn = root.querySelector('.sx-shop-send');
  const chips = root.querySelectorAll('.sx-shop-chip');

  const welcome = [
    '你好～我是苏绣商城助手，可以帮你推荐作品、文创礼品、活动信息，解答购物流程。',
    '可查询：热门绣品、送礼选择、购物车搭配、展览预约、下单结账。'
  ];

  function openPanel(){root.classList.add('open');}
  function closePanel(){root.classList.remove('open');}
  function scrollBottom(){list.scrollTop = list.scrollHeight;}
  function addMsg(text,role='bot'){
    const div=document.createElement('div');
    div.className=`sx-shop-msg sx-shop-${role}`;
    div.textContent=text;
    list.appendChild(div);
    scrollBottom();
  }
  function normalize(s){return String(s||'').trim();}
  function answer(q){
    const text=normalize(q);
    if(/(热门|作品|爆款)/.test(text)){
      return '热门推荐：千里江山图系列、双面绣螳螂猫、花鸟山水绣品、经典团扇摆件，工艺精湛，收藏价值高。';
    }
    if(/(送礼|文创|长辈|朋友)/.test(text)){
      return '送礼优选：苏绣书签、古风团扇、小型屏风、花鸟文创小件，国风雅致，兼具实用性与非遗纪念意义。';
    }
    if(/(购物车|搭配)/.test(text)){
      return '搭配建议：山水类绣品可搭配同风格文创，花鸟作品适配古风配饰摆件，风格统一提升收藏质感。';
    }
    if(/(活动|展览|动态|预约)/.test(text)){
      return '近期展览活动可在【有关动态】页面查看，支持活动收藏、线上预约，实时了解苏绣文化展览资讯。';
    }
    if(/(加购|结账|支付)/.test(text)){
      return '购物流程：点击商品加入购物车，可增减数量、删除商品，确认订单后微信扫码完成支付，操作简单便捷。';
    }
    return '你可以咨询：热门作品推荐、文创送礼、购物车搭配、展览活动、下单操作等问题。';
  }
  function botReply(q){addMsg(normalize(q),'user');setTimeout(()=>addMsg(answer(q),'bot'),180);}
  toggle.addEventListener('click',()=>root.classList.contains('open')?closePanel():openPanel());
  closeBtn.addEventListener('click',closePanel);
  chips.forEach(btn=>btn.addEventListener('click',()=>botReply(btn.dataset.q)));
  sendBtn.addEventListener('click',()=>{const t=normalize(input.value);if(!t)return;input.value='';botReply(t);});
  input.addEventListener('keydown',e=>e.key==='Enter'&&sendBtn.click());
  document.addEventListener('click',e=>{if(!root.contains(e.target))closePanel();});
  document.addEventListener('keydown',e=>e.key==='Escape'&&closePanel());
  welcome.forEach(t=>addMsg(t,'bot'));
})();
</script>
