            --bg-green: #F2F8F4;

        }

            background-image: radial-gradient(circle at 10% 20%, rgba(184,156,104,0.08) 1.5px, transparent 1px);
            background-size: 18px 18px;
        }
        .cloud-pattern {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23B89C68" opacity="0.05"><path d="M6.5 12.5c0-1.38 1.12-2.5 2.5-2.5.53 0 1.02.16 1.42.44.47-1.06 1.55-1.78 2.78-1.78 1.68 0 3.04 1.36 3.04 3.04 0 .23-.03.45-.08.66.93.33 1.6 1.16 1.6 2.14 0 1.24-1.01 2.25-2.25 2.25h-8.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5z"/></svg>');

            backdrop-filter: blur(8px);

            transition: transform 0.1s;
        }

        .quantity-btn {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;

    <script>
        // ---------- 购物车核心逻辑 (新商品自动置顶：每次添加都会把新增商品挪到数组最前面)----------
        let cart = JSON.parse(localStorage.getItem('suzhou_cart')) || [];

        // 辅助函数：保存购物车 & 更新徽章 & 重绘购物车界面（购物车按添加顺序显示，最新的在最上面）
        function saveCartAndSync() {
            localStorage.setItem('suzhou_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartPage();
        }

        function updateCartBadge() {
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-badge');
            if(badge) {
                if(totalQty > 0) {
                    badge.innerText = totalQty;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast-message');
            const iconSpan = toast.querySelector('i');
            if(isError) {
                iconSpan.className = "fas fa-exclamation-circle text-amber-300";
            } else {
                iconSpan.className = "fas fa-check-circle text-[#B89C68]";
            }
            toast.querySelector('span').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2200);
        }

        // 增加数量（不改变排序）
        function updateQuantity(productId, delta) {
            const idx = cart.findIndex(item => item.id === productId);
            if(idx !== -1) {
                const newQty = cart[idx].quantity + delta;
                if(newQty <= 0) {
                    cart.splice(idx, 1);
                    showToast(`已移除商品`);
                } else {
                    cart[idx].quantity = newQty;
                    showToast(`数量已更新`);
                }
                saveCartAndSync();
            }
        }

        function removeItem(productId) {
            cart = cart.filter(item => item.id !== productId);
            showToast(`商品已从购物车删除`);
            saveCartAndSync();
        }

        // 清空购物车
        function clearCart() {
            if(cart.length === 0) {
                showToast(`购物车已经是空的`, true);
                return;
            }
            cart = [];
            saveCartAndSync();
            showToast(`购物车已清空`);
        }

        // 重点：添加商品时，如果已存在则增加数量并提升到最前面；如果是新商品则直接unshift
        // 为了外部调用方便，提供此方法（也供推荐区域调用）
        function addToCartWithPriority(product) {
            const existingIndex = cart.findIndex(item => item.id === product.id);
            if(existingIndex !== -1) {
                // 存在: 数量+1，并把该项移动到数组最前面
                cart[existingIndex].quantity += 1;
                const movedItem = cart.splice(existingIndex, 1)[0];
                cart.unshift(movedItem);
                showToast(`${product.name} 数量+1，已移至购物车顶部`);
            } else {
                // 新商品直接插入到最前面
                const newItem = { ...product, quantity: 1 };
                cart.unshift(newItem);
                showToast(`${product.name} 已加入购物车（置顶显示）`);
            }
            saveCartAndSync();
        }

        // 渲染购物车（按照当前数组顺序展示，最新的在上面）
        function renderCartPage() {
            const container = document.getElementById('cart-items-list');
            const summaryDiv = document.getElementById('cart-summary');
            const emptyDiv = document.getElementById('empty-cart-message');
            const cartContainerDiv = document.getElementById('cart-container');
            
            if(!container) return;
            
            if(cart.length === 0) {
                container.innerHTML = '';
                if(emptyDiv) emptyDiv.classList.remove('hidden');
                if(summaryDiv) summaryDiv.classList.add('hidden');
                if(cartContainerDiv) cartContainerDiv.classList.add('bg-transparent', 'shadow-none');
                document.getElementById('total-items-count').innerText = '0';
                document.getElementById('total-price').innerHTML = '¥0';
                return;
            }
            if(emptyDiv) emptyDiv.classList.add('hidden');
            if(summaryDiv) summaryDiv.classList.remove('hidden');
            if(cartContainerDiv) cartContainerDiv.classList.remove('bg-transparent', 'shadow-none');
            
            let totalPrice = 0;
            let totalItems = 0;
            const itemsHtml = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;
                totalItems += item.quantity;
                return `
                    <div class="cart-item flex flex-col sm:flex-row gap-4 p-5 bg-white/40 hover:bg-white/60 transition">
                        <img src="${item.image || 'https://picsum.photos/id/104/100/100'}" alt="${item.name}" class="w-24 h-24 rounded-xl object-cover shadow-sm">
                        <div class="flex-1">
                            <div class="flex justify-between flex-wrap">
                                <h3 class="font-semibold text-lg">${escapeHtml(item.name)}</h3>
                                <p class="text-[#B89C68] font-bold">¥${item.price}</p>
                            </div>
                            <div class="flex items-center gap-3 mt-3 flex-wrap">
                                <div class="flex items-center border border-[#A9C3B2] rounded-full">
                                    <button class="quantity-btn w-8 h-8 rounded-l-full hover:bg-[#A9C3B2]/30 text-lg" data-id="${item.id}" data-delta="-1">-</button>
                                    <span class="w-10 text-center font-medium">${item.quantity}</span>
                                    <button class="quantity-btn w-8 h-8 rounded-r-full hover:bg-[#A9C3B2]/30 text-lg" data-id="${item.id}" data-delta="1">+</button>
                                </div>
                                <button class="remove-item text-red-400 hover:text-red-600 text-sm flex items-center gap-1" data-id="${item.id}"><i class="fas fa-trash-alt"></i> 删除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            container.innerHTML = itemsHtml;
            document.getElementById('total-items-count').innerText = totalItems;
            document.getElementById('total-price').innerHTML = `¥${totalPrice.toFixed(2)}`;
            
            // 绑定数量增减事件
            document.querySelectorAll('.quantity-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.getAttribute('data-id'));
                    const delta = parseInt(btn.getAttribute('data-delta'));
                    updateQuantity(id, delta);
                });
            });
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    removeItem(id);
                });
            });
        }
        
        // 简单防XSS
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }
        
        // ---------- 优质苏绣推荐库 ----------
const allRecommendProducts = [
    { id: 1, name: '仕女蹴鞠图', price: 29800, image: './苏绣/仕女蹴鞠图.jpeg', category: '经典名画', tag: '姚建萍' },
    { id: 2, name: '水乡之晨', price: 38000, image: './苏绣/姚惠芬-水乡之晨.JPG', category: '山水风景', tag: '姚惠芬' },
    { id: 3, name: '千里江山图', price: 19800, image: './苏绣/千里江山图.jpg', category: '经典名画', tag: '姚建萍' },
    { id: 4, name: '玉兰飘香', price: 29800, image: './苏绣/玉兰飘香.jpg', category: '花草雅韵', tag: '姚建萍' },
    { id: 5, name: '新辉煌', price: 29800, image: './苏绣/新辉煌.jpg', category: '山水风景', tag: '姚建萍' },
    { id: 6, name: '锦绣河山', price: 39800, image: './苏绣/锦绣河山.jpg', category: '山水风景', tag: '姚建萍' },
    { id: 7, name: '《缠绕》小幅复刻', price: 80000, image: './苏绣/缠绕.jpeg', category: '花草雅韵', tag: '邹英姿' },
    { id: 8, name: '鸿运当头', price: 42000, image: './苏绣/鸿运当头.jpg', category: '动物神韵', tag: '邹英姿' },
    { id: 9, name: '凝视', price: 4980000, image: './苏绣/▲任嘒闲刺绣作品《凝视》.jpg', category: '人物风骨', tag: '任嘒闲' },
    { id: 10, name: '中国皇后与皇子', price: 8333383, image: './苏绣/中国皇后与皇子.jpg', category: '人物风骨', tag: '朱寿珍' },

    { id: 12, name: '一团和气', price: 877828, image: './苏绣/一团和气.jpg', category: '人物风骨', tag: '朱寿珍' },

];
        
        // 推荐列表状态
        let dismissedRecommendIds = JSON.parse(localStorage.getItem('suzhou_dismissed_rec')) || [];
        let currentPriceLimit = 9999999;
        
        function saveDismissed() {
            localStorage.setItem('suzhou_dismissed_rec', JSON.stringify(dismissedRecommendIds));
        }
        
        function getFilteredRecommendations(priceMax) {
            return allRecommendProducts.filter(prod => prod.price <= priceMax && !dismissedRecommendIds.includes(prod.id));
        }
        
        function renderRecommendations() {
            const container = document.getElementById('recommend-list');
            const tipEl = document.getElementById('no-recommend-tip');
            if(!container) return;
            const filtered = getFilteredRecommendations(currentPriceLimit);
            if(filtered.length === 0) {
                container.innerHTML = '';
                if(tipEl) tipEl.classList.remove('hidden');
                return;
            }
            if(tipEl) tipEl.classList.add('hidden');
            const recHtml = filtered.map(prod => `
                <div class="recommend-card bg-white rounded-xl p-3 flex gap-3 shadow-sm border border-[#A9C3B2]/20" data-id="${prod.id}">
                    <img src="${prod.image}" class="w-20 h-20 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h4 class="font-semibold text-[#2F4B43]">${escapeHtml(prod.name)}</h4>
                            <span class="text-[#B89C68] font-bold text-sm">¥${prod.price}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">${prod.category} · ${prod.tag}</p>
                        <div class="flex gap-2 mt-2">
                            <button class="add-to-cart-rec text-xs bg-[#7EA08F] text-white px-3 py-1 rounded-full hover:bg-[#5c836e] transition btn-scale" data-id="${prod.id}" data-name="${prod.name}" data-price="${prod.price}" data-img="${prod.image}"><i class="fas fa-cart-plus mr-1"></i>加入购物车</button>
                            <button class="dismiss-rec text-xs text-gray-400 hover:text-red-400 transition" data-id="${prod.id}"><i class="fas fa-times-circle"></i> 不感兴趣</button>
                        </div>
                    </div>
                </div>
            `).join('');
            container.innerHTML = recHtml;
            
            document.querySelectorAll('.add-to-cart-rec').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.getAttribute('data-id'));
                    const name = btn.getAttribute('data-name');
                    const price = parseFloat(btn.getAttribute('data-price'));
                    const image = btn.getAttribute('data-img');
                    addToCartWithPriority({ id, name, price, image });
                });
            });
            document.querySelectorAll('.dismiss-rec').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.getAttribute('data-id'));
                    if(!dismissedRecommendIds.includes(id)) {
                        dismissedRecommendIds.push(id);
                        saveDismissed();
                        renderRecommendations();
                        showToast(`已移除推荐`, false);
                    }
                });
            });
        }
        
        function resetRecommendations() {
            dismissedRecommendIds = [];
            saveDismissed();
            renderRecommendations();
            showToast(`已重置推荐列表`, false);
        }
        
        function initPriceFilter() {
            const slider = document.getElementById('price-filter');
            const rangeVal = document.getElementById('price-range-value');
            const applyBtn = document.getElementById('apply-price-filter');
            if(slider) {
                slider.addEventListener('input', (e) => {
                    rangeVal.innerText = e.target.value;
                });
                applyBtn.addEventListener('click', () => {
                    const val = parseInt(slider.value);
                    currentPriceLimit = val;
                    renderRecommendations();
                    showToast(`筛选 ¥${val} 以下优质苏绣`, false);
                });
            }
        }
        
        // 微信弹窗逻辑 (结账)
        const modal = document.getElementById('wechat-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const mockPayBtn = document.getElementById('mock-pay-success');
        
function openWechatModal() {
    if(cart.length === 0) {
        showToast(`购物车为空，无法结算`, true);
        return;
    }
    const total = cart.reduce((sum,item)=>sum+item.price*item.quantity,0);
    const modalTotalSpan = document.getElementById('modal-total-amount');
    modalTotalSpan.innerText = total.toLocaleString();
    modal.classList.add('active');
}
        
        function closeModal() {
            modal.classList.remove('active');
        }
        
        function mockPaySuccess() {
            if(cart.length === 0) {
                closeModal();
                showToast(`购物车已空`, true);
                return;
            }
            const total = cart.reduce((sum,item)=>sum+item.price*item.quantity,0);
            showToast(`支付成功！订单金额 ¥${total.toFixed(2)}，感谢您的雅藏 ❤️`, false);
            // 清空购物车
            cart = [];
            saveCartAndSync();
            closeModal();
        }
        
        // UI初始化
        function initUIComponents() {
            const header = document.getElementById('main-header');
            window.addEventListener('scroll', () => {
                if(window.scrollY > 20) header.classList.add('navbar-scrolled');
                else header.classList.remove('navbar-scrolled');
            });
            const menuBtn = document.getElementById('mobile-menu-btn');
            const mobileNav = document.getElementById('mobile-nav');
            if(menuBtn && mobileNav) {
                menuBtn.addEventListener('click', () => {
                    mobileNav.classList.toggle('open');
                });
            }
            const clearCartBtn = document.getElementById('clear-cart-btn');
            if(clearCartBtn) clearCartBtn.addEventListener('click', clearCart);
            const checkoutBtn = document.getElementById('checkout-btn');
            if(checkoutBtn) checkoutBtn.addEventListener('click', openWechatModal);
            const resetRecBtn = document.getElementById('reset-recommend');
            if(resetRecBtn) resetRecBtn.addEventListener('click', resetRecommendations);
            if(closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
            if(mockPayBtn) mockPayBtn.addEventListener('click', mockPaySuccess);
            modal.addEventListener('click', (e) => {
                if(e.target === modal) closeModal();
            });
        }
        
        function init() {
            renderCartPage();
            initPriceFilter();
            renderRecommendations();
            initUIComponents();
            updateCartBadge();
        }
        
        init();
    </script>

<style>
  #sxShopAi {
    --sx-green: #2a7d5e;

  #sxShopAi .sx-shop-toggle {

    transition: 0.2s ease;

  #sxShopAi .sx-shop-toggle:hover {
    transform: translateY(-2px);
  }

  #sxShopAi .sx-shop-panel {
    position: absolute;
    right: 0;
    bottom: 76px;
    width: min(92vw, 360px);
    height: min(72vh, 520px);
    background: #fff;
    border: 1px solid var(--sx-line);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);

  }

  #sxShopAi.open .sx-shop-panel {
    display: flex;
    animation: sxFadeUp 0.18s ease-out;
  }

  @keyframes sxFadeUp {
    from {opacity: 0;transform: translateY(10px) scale(0.98);}

  }

  #sxShopAi .sx-shop-header {
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--sx-green), #3da272);

    gap: 10px;
  }

  #sxShopAi .sx-shop-title {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  #sxShopAi .sx-shop-title strong {font-size: 15px;}
  #sxShopAi .sx-shop-title span {font-size: 12px;opacity: 0.9;}
  #sxShopAi .sx-shop-close {
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  #sxShopAi .sx-shop-messages {flex: 1;padding: 12px;background: var(--sx-bg);overflow: auto;}

<div id="sxShopAi">
  <button class="sx-shop-toggle" type="button">AI</button>
  <div class="sx-shop-panel">
    <div class="sx-shop-header">
      <div class="sx-shop-title">
        <strong>苏绣AI导购助手</strong>
        <span>作品推荐 · 购物帮助 · 活动联动</span>
      </div>
      <button class="sx-shop-close" type="button">×</button>
    </div>
    <div class="sx-shop-messages"></div>
    <div class="sx-shop-quick">
      <button class="sx-shop-chip" data-q="推荐热门苏绣作品">热门作品</button>
      <button class="sx-shop-chip" data-q="推荐适合送礼的文创">送礼文创</button>
      <button class="sx-shop-chip" data-q="根据购物车商品搭配推荐">搭配推荐</button>
      <button class="sx-shop-chip" data-q="推荐近期苏绣展览活动">近期活动</button>
      <button class="sx-shop-chip" data-q="怎么加购和结账">加购结账</button>
    </div>
    <div class="sx-shop-inputbar">
      <input class="sx-shop-input" placeholder="输入问题，比如：适合送长辈的苏绣礼品">
      <button class="sx-shop-send">发送</button>
    </div>
  </div>
</div>

<script>
(() => {
  const root = document.getElementById('sxShopAi');
  if (!root) return;
  const toggle = root.querySelector('.sx-shop-toggle');
  const closeBtn = root.querySelector('.sx-shop-close');
  const list = root.querySelector('.sx-shop-messages');
  const input = root.querySelector('.sx-shop-input');
  const sendBtn = root.querySelector('.sx-shop-send');
  const chips = root.querySelectorAll('.sx-shop-chip');

  const welcome = [
    '你好～我是苏绣商城助手，可以帮你推荐作品、文创礼品、活动信息，解答购物流程。',
    '可查询：热门绣品、送礼选择、购物车搭配、展览预约、下单结账。'
  ];

  function openPanel(){root.classList.add('open');}
  function closePanel(){root.classList.remove('open');}
  function scrollBottom(){list.scrollTop = list.scrollHeight;}
  function addMsg(text,role='bot'){
    const div=document.createElement('div');
    div.className=`sx-shop-msg sx-shop-${role}`;
    div.textContent=text;
    list.appendChild(div);
    scrollBottom();
  }
  function normalize(s){return String(s||'').trim();}
  function answer(q){
    const text=normalize(q);
    if(/(热门|作品|爆款)/.test(text)){
      return '热门推荐：千里江山图系列、双面绣螳螂猫、花鸟山水绣品、经典团扇摆件，工艺精湛，收藏价值高。';
    }
    if(/(送礼|文创|长辈|朋友)/.test(text)){
      return '送礼优选：苏绣书签、古风团扇、小型屏风、花鸟文创小件，国风雅致，兼具实用性与非遗纪念意义。';
    }
    if(/(购物车|搭配)/.test(text)){
      return '搭配建议：山水类绣品可搭配同风格文创，花鸟作品适配古风配饰摆件，风格统一提升收藏质感。';
    }
    if(/(活动|展览|动态|预约)/.test(text)){
      return '近期展览活动可在【有关动态】页面查看，支持活动收藏、线上预约，实时了解苏绣文化展览资讯。';
    }
    if(/(加购|结账|支付)/.test(text)){
      return '购物流程：点击商品加入购物车，可增减数量、删除商品，确认订单后微信扫码完成支付，操作简单便捷。';
    }
    return '你可以咨询：热门作品推荐、文创送礼、购物车搭配、展览活动、下单操作等问题。';
  }
  function botReply(q){addMsg(normalize(q),'user');setTimeout(()=>addMsg(answer(q),'bot'),180);}
  toggle.addEventListener('click',()=>root.classList.contains('open')?closePanel():openPanel());
  closeBtn.addEventListener('click',closePanel);
  chips.forEach(btn=>btn.addEventListener('click',()=>botReply(btn.dataset.q)));
  sendBtn.addEventListener('click',()=>{const t=normalize(input.value);if(!t)return;input.value='';botReply(t);});
  input.addEventListener('keydown',e=>e.key==='Enter'&&sendBtn.click());
  document.addEventListener('click',e=>{if(!root.contains(e.target))closePanel();});
  document.addEventListener('keydown',e=>e.key==='Escape'&&closePanel());
  welcome.forEach(t=>addMsg(t,'bot'));
})();
</script>
</body>
